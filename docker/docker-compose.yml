# Entorno de desarrollo: app con recarga + emulador de Firestore + MailHog (Brevo falso).
name: ds-hd-dev

services:
  app:
    image: node:22-bookworm-slim
    working_dir: /app
    command: sh -c "npm install && npm run build:assets && npm run dev"
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: "3000"
      APP_BASE_URL: http://localhost:3000
      FIREBASE_PROJECT_ID: ds-hd-local
      FIRESTORE_EMULATOR_HOST: firebase:8080
      FIREBASE_AUTH_EMULATOR_HOST: firebase:9099
      SESSION_COOKIE_SECRET: dev-insecure-secret-change-me-please
      BREVO_API_KEY: ""
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
    volumes:
      - ..:/app
      - ds-hd-node-modules:/app/node_modules
    depends_on:
      - firebase
      - mailhog

  # Emuladores de Firestore + Auth (imagen oficial con Java + firebase-tools).
  firebase:
    image: andreysenov/firebase-tools:latest
    command: >
      firebase emulators:start
      --project ds-hd-local
      --only firestore,auth
    ports:
      - "8080:8080"
      - "9099:9099"
      - "4000:4000"
    working_dir: /home/node
    volumes:
      - ../firebase.json:/home/node/firebase.json:ro
      - ../firestore.rules:/home/node/firestore.rules:ro

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "8025:8025" # UI web
      - "1025:1025" # SMTP

volumes:
  ds-hd-node-modules:
