# Entorno de desarrollo: app con recarga + emulador de Firestore + MailHog (Brevo falso).
name: ds-hd-dev

services:
  app:
    image: node:22-bookworm-slim
    working_dir: /app
    command: sh -c "npm install && npm run build:assets && npm run dev"
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: "3000"
      APP_BASE_URL: http://localhost:3000
      FIREBASE_PROJECT_ID: ds-hd-local
      FIRESTORE_EMULATOR_HOST: firestore:8080
      SESSION_COOKIE_SECRET: dev-insecure-secret-change-me-please
      BREVO_API_KEY: ""
    volumes:
      - ..:/app
      - ds-hd-node-modules:/app/node_modules
    depends_on:
      - firestore
      - mailhog

  firestore:
    image: google/cloud-sdk:emulators
    command: >
      gcloud emulators firestore start
      --host-port=0.0.0.0:8080
      --project=ds-hd-local
    ports:
      - "8080:8080"

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "8025:8025" # UI web
      - "1025:1025" # SMTP

volumes:
  ds-hd-node-modules:
